name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production" to confirm production deployment'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write
  checks: write
  pull-requests: write
  id-token: write

jobs:
  validate-manual-deployment:
    name: Validate Manual Deployment
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      - name: Check confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy-production" ]; then
            echo "Deployment cancelled: confirmation not provided"
            exit 1
          fi
          echo "Manual deployment confirmed"

  tests:
    name: Run Tests
    needs: validate-manual-deployment
    if: always() && (needs.validate-manual-deployment.result == 'success' || needs.validate-manual-deployment.result == 'skipped')
    uses: ./.github/workflows/ci_run_tests.yml
  
  build-push:
    name: Build and Push
    needs: tests
    uses: ./.github/workflows/ci_build_push.yml
    with:
      environment: production
      image-tag: latest
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REGISTRY_NAME: ${{ secrets.ARTIFACT_REGISTRY_NAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}
  
  deploy:
    name: Deploy
    needs: build-push
    uses: ./.github/workflows/cd_deploy.yml
    with:
      environment: production
      image-tag: production
    secrets:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      APP_DOMAIN: ${{ secrets.PROD_APP_DOMAIN }}
      HEALTH_ENDPOINT: ${{ secrets.HEALTH_ENDPOINT }}
      VM_IP: ${{ secrets.PROD_VM_IP }}
      VM_USER: ${{ secrets.PROD_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      GCP_REGION: ${{ secrets.GCP_REGION }}
      ARTIFACT_REGISTRY_NAME: ${{ secrets.ARTIFACT_REGISTRY_NAME }}
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy]
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      
      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## Production Deployment
            
            **Deployed:** ${{ github.event.head_commit.timestamp }}
            **Commit:** ${{ github.sha }}
            
            ### Changes
            ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
  
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, create-release]
    if: always()
    
    steps:
      - name: Deployment status
        run: |
          echo "## Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** v${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "Production deployment successful"
          else
            echo "Production deployment failed"
            exit 1
          fi