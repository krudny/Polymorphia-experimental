name: Notify Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment (staging, production, develop)'
        required: true
        type: string
      deploy-result:
        description: 'Result of the deploy job'
        required: true
        type: string

jobs:
  notify:
    name: Report Status
    runs-on: ubuntu-latest

    steps:
      - name: Deployment status
        run: |
          ENVIRONMENT="${{ inputs.environment }}"
          RESULT="${{ inputs.deploy-result }}"
          
          echo "## ${ENVIRONMENT^} Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** $RESULT" >> $GITHUB_STEP_SUMMARY
          
          if [ "$RESULT" = "success" ]; then
            echo "Deployment to $ENVIRONMENT successful"
          else
            echo "Deployment to $ENVIRONMENT failed"
            exit 1
          fi
