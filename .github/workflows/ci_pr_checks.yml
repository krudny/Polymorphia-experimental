name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/ci_run_tests.yml
    
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Maven
        uses: ./.github/actions/ci_setup_java
      
      - name: Verify build
        working-directory: ./polymorphia-backend
        run: |
          mvn clean verify -DskipTests -B -V
      
      - name: Check Docker build
        run: |
          docker build -t test-build:${{ github.event.pull_request.number }} ./polymorphia-backend
  
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      
      - name: Setup Maven
        uses: ./.github/actions/ci_setup_java
      
      - name: Run SpotBugs
        working-directory: ./polymorphia-backend
        run: |
          mvn spotbugs:check -B
  
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          scan-type: 'fs'
          scan-ref: './polymorphia-backend'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@9e907b5e64f6b83e7804b09294d44122997950d6 # v4.32.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
  
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [tests, build-check, code-quality, security-scan]
    if: always()
    
    steps:
      - name: Generate PR summary
        run: |
          echo "## Pull Request Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Check if all required checks passed
        if: |
          needs.tests.result != 'success' ||
          needs.build-check.result != 'success' ||
          needs.code-quality.result != 'success'
        run: |
          echo "Required checks failed"
          exit 1