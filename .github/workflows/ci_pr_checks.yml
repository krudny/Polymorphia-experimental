name: Pull Request Checks

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write
  actions: read

jobs:
  tests:
    name: Run Tests
    uses: ./.github/workflows/ci_run_tests.yml
    
  build-check:
    name: Check Docker Build
    runs-on: ubuntu-latest
    needs: tests
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Setup Maven
        uses: ./.github/actions/ci_setup_java
      
      - name: Verify build
        working-directory: ./polymorphia-backend
        run: |
          mvn clean verify -DskipTests -B -V
      
      - name: Check Docker build
        run: |
          docker build -t test-build:${{ github.event.pull_request.number }} ./polymorphia-backend
  
  code-quality:
    name: Check Code Quality
    runs-on: ubuntu-latest
    needs: build-check
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      
      - name: Setup Maven
        uses: ./.github/actions/ci_setup_java
      
      - name: Run SpotBugs
        working-directory: ./polymorphia-backend
        run: |
          mvn spotbugs:check -B
  
  security-scan:
    name: Run Security Scan
    runs-on: ubuntu-latest
    needs: code-quality
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@c1824fd6edce30d7ab345a9989de00bbd46ef284 # v0.34.0
        with:
          scan-type: 'fs'
          scan-ref: './'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      # - name: Upload Trivy results to GitHub Security
      #   uses: github/codeql-action/upload-sarif@v3
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'
  
  pr-summary:
    name: Generate Summary
    runs-on: ubuntu-latest
    needs: [tests, build-check, code-quality, security-scan]
    if: always() && github.event_name == 'pull_request'
    
    steps:
      - name: Check if there are results to summarize
        id: check-results
        run: |
          if [[ "${{ needs.tests.result }}" == "skipped" && \
                "${{ needs.build-check.result }}" == "skipped" && \
                "${{ needs.code-quality.result }}" == "skipped" && \
                "${{ needs.security-scan.result }}" == "skipped" ]]; then
            echo "has_results=false" >> $GITHUB_OUTPUT
            echo "All jobs were skipped, nothing to summarize"
          else
            echo "has_results=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate PR summary
        if: steps.check-results.outputs.has_results == 'true'
        run: |
          echo "## Pull Request Checks Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR:** #${{ github.event.pull_request.number }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target Branch:** ${{ github.base_ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results:" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Security Scan: ${{ needs.security-scan.result }}" >> $GITHUB_STEP_SUMMARY
          
      - name: Check if all required checks passed
        if: steps.check-results.outputs.has_results == 'true'
        run: |
          if [[ "${{ needs.tests.result }}" != "success" || \
                "${{ needs.build-check.result }}" != "success" || \
                "${{ needs.code-quality.result }}" != "success" ]]; then
            echo "❌ Required checks failed"
            exit 1
          else
            echo "✅ All required checks passed"
          fi
      
      - name: Fail job if nothing to summarize
        if: steps.check-results.outputs.has_results == 'false'
        run: |
          echo "No job results to summarize - all jobs were skipped"
          exit 1
