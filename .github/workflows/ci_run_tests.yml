name: Run Tests

on: 
  workflow_call:
    inputs:
      working-directory: 
        type: string
        description: 'Working backend directory'
        required: false
        default: './polymorphia-backend'
      spring-profile:
        type: string
        description: 'Spring profile to use'
        required: false
        default: 'test'
    outputs:
      test-result:
        description: 'Test execution result'
        value: ${{ jobs.aggregate-results.outputs.result }}

jobs: 
  test-backend: 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write  
      pull-requests: write

    steps: 
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Java with Maven
        uses: ./.github/actions/ci_setup_java
        with:
          working-directory: ${{ inputs.working-directory }}

      - name: Run Tests
        id: test-backend
        working-directory: ${{ inputs.working-directory }}
        run: |
          mvn clean test -Dspring.profiles.active=${{ inputs.spring-profile }} -B -V

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Backend Tests
          path: ${{ inputs.working-directory }}/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false
          list-tests: failed     
          max-annotations: 10

  aggregate-results:
    runs-on: ubuntu-latest
    if: always()
    needs: [test-backend]
    
    outputs:
      result: ${{ steps.aggregate.outputs.result }}
    
    steps:
      - name: Aggregate Results
        id: aggregate
        run: |
          test_result="${{ needs.test-backend.result }}"
          echo "Tests: $test_result"
          
          if [[ "$test_result" == "failure" ]]; then
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          elif [[ "$test_result" == "success" ]]; then
            echo "result=success" >> $GITHUB_OUTPUT
          else
            echo "result=cancelled" >> $GITHUB_OUTPUT
            exit 1
          fi
