name: "Deploy | Executor to Dev"

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-executor-dev
  cancel-in-progress: false

jobs:
  resolve-host:
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-executor-dev')) || (github.event_name == 'workflow_dispatch' && github.actor == 'krudny')
    name: Resolve Dev Executor Host
    runs-on: ubuntu-latest
    environment: dev-executor
    outputs:
      vm_ip: ${{ steps.get-ip.outputs.vm_ip }}
    steps:
      - name: Verify authorized user
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "krudny" ]; then
            echo "Error: User ${{ github.actor }} is not authorized to deploy executor."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db

      - name: Get VM External IP
        id: get-ip
        run: |
          VM_NAME="${{ secrets.DEV_EXECUTOR_VM_NAME || 'polymorphia-dev-executor-vm' }}"
          ZONE="${{ secrets.GCP_ZONE || 'europe-west1-b' }}"

          VM_IP=$(gcloud compute instances describe "$VM_NAME" --zone="$ZONE" --format="get(networkInterfaces[0].accessConfigs[0].natIP)" 2>/dev/null || true)

          if [ -z "$VM_IP" ]; then
            echo "Error: Could not obtain external IP for $VM_NAME in zone $ZONE."
            exit 1
          fi

          echo "vm_ip=$VM_IP" >> "$GITHUB_OUTPUT"
          echo "Resolved dynamic IP: $VM_IP"

  deploy:
    needs: [resolve-host]
    name: Deploy Executor to Dev
    uses: ./.github/workflows/deploy_executor_to_env.yml
    with:
      environment: dev-executor
      target-host: ${{ needs.resolve-host.outputs.vm_ip }}
      service-name: polymorphia-code-executor
      service-port: 8100
      target-dir: /opt/polymorphia-executor
    secrets:
      VM_USER: ${{ secrets.DEV_EXECUTOR_VM_USER || 'k_rudny1' }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_EXECUTOR_SSH_PRIVATE_KEY }}
