name: "Deploy | Executor to Dev"

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-executor-dev
  cancel-in-progress: false

jobs:
  resolve-target:
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-executor-dev')) || (github.event_name == 'workflow_dispatch' && github.actor == 'krudny')
    name: Resolve Dev Executor Target
    runs-on: ubuntu-latest
    outputs:
      vm_ip: ${{ steps.get-ip.outputs.vm_ip }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Get Executor VM IP
        id: get-ip
        run: |
          VM_NAME="${{ secrets.DEV_EXECUTOR_VM_NAME }}"
          ZONE="${{ secrets.GCP_ZONE }}"
          IP=$(gcloud compute instances describe "$VM_NAME" --zone="$ZONE" --format='get(networkInterfaces[0].accessConfigs[0].natIP)')
          if [ -z "$IP" ]; then
            echo "Error: Could not retrieve external IP for $VM_NAME in zone $ZONE. Make sure the instance is running."
            exit 1
          fi
          echo "vm_ip=$IP" >> "$GITHUB_OUTPUT"
          echo "Resolved $VM_NAME IP: $IP"

  deploy:
    needs: [resolve-target]
    name: Deploy Executor to Dev
    uses: ./.github/workflows/deploy_executor_to_env.yml
    with:
      environment: dev-executor
      service-name: polymorphia-code-executor
      service-port: 8100
      target-dir: /mnt/data/executor
    secrets:
      VM_IP: ${{ needs.resolve-target.outputs.vm_ip }}
      VM_USER: ${{ secrets.DEV_EXECUTOR_VM_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.DEV_EXECUTOR_SSH_PRIVATE_KEY }}
