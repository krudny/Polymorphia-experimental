name: "Deploy | Executor to Dev"

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-executor-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-executor-dev')) || (github.event_name == 'workflow_dispatch' && github.actor == 'krudny')
    name: Deploy Executor to Dev
    runs-on: ubuntu-latest
    environment: dev-executor
    steps:
      - name: Verify authorized user
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.actor }}" != "krudny" ]; then
            echo "Error: User ${{ github.actor }} is not authorized to deploy executor."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: Build JAR with Gradle
        working-directory: ./polymorphia-code-executor
        run: |
          ./gradlew clean bootJar
          mkdir -p build/artifacts
          cp $(ls build/libs/*.jar | grep -v 'plain' | head -n 1) build/artifacts/executor.jar

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Install NumPy for fast IAP tunnel transfer
        run: |
          pip3 install --quiet numpy

      - name: Check Dev Executor VM Status
        run: |
          VM_NAME="${{ secrets.DEV_EXECUTOR_VM_NAME }}"
          ZONE="${{ secrets.GCP_ZONE }}"
          STATUS=$(gcloud compute instances describe "$VM_NAME" --zone="$ZONE" --format="get(status)")
          if [ "$STATUS" != "RUNNING" ]; then
            echo "Error: Instance $VM_NAME in zone $ZONE is not RUNNING (status: $STATUS)."
            echo "Use the 'Util | Manage Executor VM' workflow to start it first."
            exit 1
          fi
          echo "VM $VM_NAME is RUNNING."

      - name: Configure SSH and IAP Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_EXECUTOR_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          cat << 'EOF' > ~/.ssh/config
          Host dev-executor
            HostName ${{ secrets.DEV_EXECUTOR_VM_NAME }}
            User ${{ secrets.DEV_EXECUTOR_VM_USER }}
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            ProxyCommand gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=${{ secrets.GCP_ZONE }} --project=${{ secrets.GCP_PROJECT_ID }} --verbosity=warning
          EOF
          chmod 600 ~/.ssh/config

      - name: Copy JAR via IAP Tunnel
        run: |
          echo "Transferring executor.jar via IAP tunnel..."
          scp ./polymorphia-code-executor/build/artifacts/executor.jar dev-executor:/tmp/executor.jar

      - name: Update service and verify health via IAP Tunnel
        run: |
          echo "Updating service on dev-executor via IAP tunnel..."
          ssh dev-executor << 'EOF'
            set -euo pipefail
            sudo mkdir -p /opt/polymorphia-executor /mnt/data/executor
            sudo cp /tmp/executor.jar /opt/polymorphia-executor/executor.jar
            sudo mv /tmp/executor.jar /mnt/data/executor/executor.jar 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl enable polymorphia-code-executor
            sudo systemctl restart polymorphia-code-executor

            for i in {1..15}; do
              if curl -sf "http://localhost:8100/actuator/health" >/dev/null 2>&1; then
                echo "Service polymorphia-code-executor is healthy on port 8100."
                exit 0
              fi
              sleep 2
            done

            echo "Error: Service polymorphia-code-executor failed health check."
            sudo journalctl -u polymorphia-code-executor -n 50 --no-pager
            exit 1
          EOF
