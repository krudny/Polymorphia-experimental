name: Deploy to Environment

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
        description: "Target environment: develop | staging | production"
      container-name:
        type: string
        required: false
        default: "polymorphia-backend"
      container-port:
        type: number
        required: false
        default: 8080
      health-check-delay:
        type: number
        required: false
        default: 300
        description: "Seconds to wait before health check"
      app-domain:
        type: string
        required: true
        description: "Application domain for health checks (e.g., http://example.com)"
    secrets:
      VM_IP:
        required: true
      VM_USER:
        required: true
      SSH_PRIVATE_KEY:
        required: true
      GCP_PROJECT_ID:
        required: true
      GCP_SA_KEY:
        required: true
      GCP_REGION:
        required: true
      ARTIFACT_REGISTRY_NAME:
        required: true
      IMAGE_NAME:
        required: true
      HEALTH_ENDPOINT:
        required: true

jobs:
  deploy:
    name: "Deploy to ${{ inputs.environment }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Get access token
        id: token
        run: |
          TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy container
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            IMAGE="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_NAME }}/${{ secrets.IMAGE_NAME }}:${{ inputs.environment }}"
            CONTAINER="${{ inputs.container-name }}-${{ inputs.environment }}"

            echo "${{ steps.token.outputs.token }}" | docker login \
              ${{ secrets.GCP_REGION }}-docker.pkg.dev --username oauth2accesstoken --password-stdin

            docker pull "$IMAGE"

            docker stop "$CONTAINER" || true
            docker rm "$CONTAINER" || true

            docker run -d --name "$CONTAINER" -p ${{ inputs.container-port }}:8080 \
                        -v /mnt/data/app-config-${{ inputs.environment }}:/app/config \
                        -v ~/polymorphia-static:/app/static \
                        "$IMAGE" \
                        --spring.config.location=file:/app/config/application.properties

            docker image prune -a --force --filter "until=168h" || true

  validate:
    name: "Validate ${{ inputs.environment }}"
    needs: [deploy]
    runs-on: ubuntu-latest

    steps:
      - name: Health check
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            CONTAINER="${{ inputs.container-name }}-${{ inputs.environment }}"
            HEALTH_URL="${{ inputs.app-domain }}${{ secrets.HEALTH_ENDPOINT }}"
            MAX_WAIT=${{ inputs.health-check-delay }}
            INTERVAL=60
            elapsed=0

            echo "Waiting ${MAX_WAIT}s for container to become healthy..."

            while [ $elapsed -lt $MAX_WAIT ]; do
              HTTP_CODE=$(curl -s -o /tmp/health_response.json -w "%{http_code}" "$HEALTH_URL" || true)

              echo "[$elapsed/${MAX_WAIT}s] HTTP status: $HTTP_CODE"
              cat /tmp/health_response.json || true

              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check passed!"
                exit 0
              fi

              sleep $INTERVAL
              elapsed=$((elapsed + INTERVAL))
            done

            echo "Health check FAILED after ${MAX_WAIT}s"
            if docker ps --filter "name=$CONTAINER" --quiet | grep -q .; then
              docker logs "$CONTAINER" --tail 100
            else
              echo "Container $CONTAINER is not running"
            fi
            exit 1

  report-status:
    name: "Report Status"
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      statuses: write

    steps:
      - name: Set commit status
        uses: myrotvorets/set-commit-status-action@3730c0a348a2ace3c110851bed53331bc6406e9f # v2.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          status: success
          context: "deploy-${{ inputs.environment }}-success"
          description: "Deployment to ${{ inputs.environment }} completed successfully"
          sha: ${{ github.event.pull_request.head.sha }}