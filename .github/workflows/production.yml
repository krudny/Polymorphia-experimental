name: Build and Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  REPO_NAME: polymorphia
  IMAGE_NAME: polymorphia-backend

jobs: 
  setup-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run tests with Maven
        working-directory: ./polymorphia-backend
        run: |
          mvn test -Dspring.profiles.active=test

  build-and-push: 
    runs-on: ubuntu-latest
    needs: setup-and-test

    permissions:
      contents: 'read'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./polymorphia-backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGION: europe-central2
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REPO_NAME: polymorphia
          IMAGE_NAME: polymorphia-backend
        with:
          host: ${{ secrets.PROD_VM_IP }}
          username: ${{ secrets.PROD_VM_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          envs: REGION,PROJECT_ID,REPO_NAME,IMAGE_NAME
          script: |
            gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
            
            docker pull ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:production
            
            docker stop polymorphia-backend || true
            docker rm polymorphia-backend || true
            
            docker run -d \
              --name polymorphia-backend \
              --restart unless-stopped \
              -p 8080:8080 \
              -v /opt/app-config/application.properties:/app/config/application.properties:ro \
              ${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO_NAME}/${IMAGE_NAME}:production
            
            docker image prune -af --filter "until=24h"

  validate: 
    - name: Validate Deployment
      run: |
        max_attempts=10
        attempt=0
        
        while [ $attempt -lt $max_attempts ]; do
          echo "Attempt $((attempt+1))/$max_attempts..."
          
          status_code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health || echo "000")
          
          if [ "$status_code" = "200" ]; then
            response=$(curl -s http://localhost:8080/actuator/health)
            health_status=$(echo $response | jq -r '.status')
            
            if [ "$health_status" = "UP" ]; then
              echo "Application is up and healthy!"
              exit 0
            else
              echo "App responded but status is: $health_status"
            fi
          else
            echo "Application not ready yet (HTTP $status_code)"
          fi
          
          attempt=$((attempt+1))
          sleep 15
        done
        
        echo "Application failed to become healthy after $max_attempts attempts"
        exit 1
