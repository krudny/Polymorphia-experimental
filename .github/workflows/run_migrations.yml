name: "DB | Run Migrations"

on:
  workflow_call:
    inputs:
      working-directory:
        type: string
        description: 'Working backend directory'
        required: false
        default: './polymorphia-backend'
      flyway-version:
        type: string
        description: 'Flyway CLI version'
        required: false
        default: '10.17.0'
    secrets:
      DB_HOST:
        required: true
      DB_PORT:
        required: true
      DB_NAME:
        required: true
      DB_USER:
        required: true
      DB_PASSWORD:
        required: true
      VM_USER:
        required: false
      SSH_PRIVATE_KEY:
        required: false

jobs:
  migrate:
    name: "Run Migrations"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Configure database connection and SSH tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VM_USER: ${{ secrets.VM_USER }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            echo "SSH credentials provided, opening SSH tunnel..."
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$DB_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            ssh -f -N -L 15432:localhost:5432 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$VM_USER@$DB_HOST"
            echo "TUNNEL_PORT=15432" >> $GITHUB_ENV
            echo "TARGET_HOST=localhost" >> $GITHUB_ENV
          else
            echo "No SSH key provided, using direct connection..."
            echo "TUNNEL_PORT=$DB_PORT" >> $GITHUB_ENV
            echo "TARGET_HOST=$DB_HOST" >> $GITHUB_ENV
          fi

      - name: Download Flyway
        run: |
          wget -qO- https://repo1.maven.org/maven2/org/flywaydb/flyway-commandline/10.17.0/flyway-commandline-10.17.0-linux-x64.tar.gz | tar xvz
          sudo ln -s $(pwd)/flyway-10.17.0/flyway /usr/local/bin/flyway

      - name: Run Flyway migrations
        run: |
          flyway \
            -url="jdbc:postgresql://${TARGET_HOST}:${TUNNEL_PORT}/${{ secrets.DB_NAME }}" \
            -user="${{ secrets.DB_USER }}" \
            -password="${{ secrets.DB_PASSWORD }}" \
            -locations="filesystem:./polymorphia-backend/src/main/resources/db/migration" \
            -baselineOnMigrate=true \
            -baselineVersion=1 \
            migrate