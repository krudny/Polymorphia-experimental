name: Seed Database from GCS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (develop | staging | production)"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - staging
          - production
      seed_path:
        description: "Path to SQL seed file in private GCS bucket (e.g. seeds/seed-basic.sql)"
        required: true
        default: "seeds/seed-basic.sql"
        type: string
      confirmation_text:
        description: "Type CONFIRM_PRODUCTION to apply seed to production"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: db-ops-${{ github.event.inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    name: Seed Database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - name: Verify authorized user
        run: |
          if [ "${{ github.actor }}" != "krudny" ]; then
            echo "Error: User ${{ github.actor }} is not authorized to seed database."
            exit 1
          fi

      - name: Verify production confirmation
        if: github.event.inputs.environment == 'production'
        run: |
          if [ "${{ github.event.inputs.confirmation_text }}" != "CONFIRM_PRODUCTION" ]; then
            echo "Error: CONFIRM_PRODUCTION confirmation is required for production."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Download seed file from GCS
        run: |
          mkdir -p /tmp/seed
          gcloud storage cp "gs://${{ secrets.SEED_BUCKET_NAME }}/${{ github.event.inputs.seed_path }}" /tmp/seed/seed.sql
          test -s /tmp/seed/seed.sql

      - name: Create schema backup on target VM
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_PORT="${{ vars.DB_PORT || secrets.DB_PORT || '5432' }}"
            BACKUP_DIR="/mnt/data/backups"
            if [ ! -d "$BACKUP_DIR" ]; then
              BACKUP_DIR="/tmp/backups"
            fi
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="${BACKUP_DIR}/${{ secrets.DB_NAME }}_pre_seed_$(date +%Y%m%d_%H%M%S).sql.gz"
            pg_dump -h localhost -p "$DB_PORT" -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" | gzip > "$BACKUP_FILE"
            test -s "$BACKUP_FILE"

      - name: Copy seed file to target VM
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "/tmp/seed/seed.sql"
          target: "/tmp/"
          strip_components: 2

      - name: Reset schema and apply seed in single transaction
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            export PGPASSWORD="${{ secrets.DB_PASSWORD }}"
            DB_PORT="${{ vars.DB_PORT || secrets.DB_PORT || '5432' }}"
            psql -h localhost -p "$DB_PORT" -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" --single-transaction -v ON_ERROR_STOP=1 <<EOF
            DROP SCHEMA public CASCADE;
            CREATE SCHEMA public;
            GRANT ALL ON SCHEMA public TO "${{ secrets.DB_USER }}";
            \i /tmp/seed.sql
            EOF
            rm -f /tmp/seed.sql
